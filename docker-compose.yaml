version: '3.8'

services:
  sitl:
    image: ardupilot-sitl-perfect:v2
    build: 
      context: .
      dockerfile: Dockerfile.sitl
    container_name: ardupilotv1
     # Відкриваємо порти наружу,  TCP 5760 для QGC, 5763 для Малини 
    ports:
      - "5760:5760"
      - "5763:5763"
    privileged: true
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    command: [
      "./arducopter",
      "-S",
      "--model", "+",
      "--speedup", "1",
      #"--defaults",
      "/ardupilot/copter.param",
      "--home", "50.4501,30.5234,18,0",
      "add-param", "SERIAL2_BAUD=115",
      "--serial2", "/dev/ttyUSB0"
    ]
    restart: always

     
  mavproxyy:
    image: skozakov/mavproxy:latest
    build:
      context: .
      dockerfile: Dockerfile.mavproxy
    container_name: mavproxy_router
    depends_on:
      - sitl
    command: --daemon --master=tcp:sitl:5760 --out=udp:host.docker.internal:14550
    environment:
      - DISPLAY=
      - AUTOTEST_HEADLESS=1
      # Відкриваємо UDP порт для QGroundControl  
    ports:
      - "14550:14550/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always


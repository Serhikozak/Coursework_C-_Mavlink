version: '3.8'

services:
  sitl:
    image: ardupilot-sitl-perfect:v2
    build: 
      context: .
      dockerfile: Dockerfile.sitl
    container_name: ardupilotv1
    
     # Відкриваємо порти наружу,  TCP 5760 для QGC, 5763 для Малини 
    ports:
      - "5760:5760"
      - "5763:5763"
      
    #extra_hosts:
    #  - "host.docker.internal:172.20.201.24"  
    privileged: true
    #devices:
    #  - "/dev/ttyUSB0:/dev/ttyUSB0"
    volumes:
      - "./custom.parm:/ardupilot/custom.parm"
    command: [
      "./arducopter",
      "-S",
      "--model", "JSON",
      "--speedup", "1",
      "--sim-address=172.20.201.24",
      "--home", "48.941553,24.763887,18,0",
      "--defaults", "/ardupilot/custom.parm"
          
    ]
    
    restart: always

     
  mavproxyy:
    image: skozakov/mavproxy:latest
    build:
      context: .
      dockerfile: Dockerfile.mavproxy
    container_name: mavproxy_router
    
    depends_on:
      - sitl
    command: --daemon --master=tcp:sitl:5760 --out=udp:host.docker.internal:14550 --out=tcpin:0.0.0.0:5765
    environment:
      - DISPLAY=
      - AUTOTEST_HEADLESS=1
      - LC_ALL=C.UTF-8
      - LANG=C.UTF-8
    # Відкриваємо UDP порт для QGroundControl  
    ports:
      - "14550:14550/udp"
      - "5765:5765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

